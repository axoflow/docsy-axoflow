name: Deploy a built docs site to Cloudflare R2
description: >
  Uploads a Hugo build to an R2 bucket in several passes, so every file type
  gets its own Cache-Control (and, for Markdown and llms*.txt, an explicit
  charset), then prunes files the build no longer produces.

# Used by every docsy-axoflow site from its publish workflow. Load it from the
# theme commit the WORKFLOW FILE pins, not from the submodule of the ref being
# built: a versioned site's "Publish versions" runs main's workflow on a
# release branch whose theme predates this action. axosyslog-core-docs'
# publish-docs.yaml checks that commit out into .pipeline-theme/. An
# unversioned site, which only ever builds the commit its workflow came from,
# can use ./themes/docsy-axoflow/.github/actions/r2-deploy directly.
#
#   - uses: ./.pipeline-theme/.github/actions/r2-deploy
#     with:
#       bucket: axosyslog-core-docs
#       destination: docs/axosyslog-core
#       protect: ${{ steps.guard.outputs.dirs }}
#       pdf-file: ${{ steps.pdf.outputs.file }}
#       access-key-id: ${{ secrets.R2_..._ACCESS_KEY_ID }}
#       secret-access-key: ${{ secrets.R2_..._ACCESS_KEY_SECRET }}
#
# Needs the AWS CLI on the runner.

inputs:
  bucket:
    description: R2 bucket name.
    required: true
  destination:
    description: Key prefix in the bucket, without leading or trailing slash (docs/axosyslog-core, docs/axoflow/0.86).
    required: true
  source-dir:
    description: The built site.
    default: public
  protect:
    description: >
      Whitespace-separated paths, relative to the destination, that --delete
      must leave alone and the Markdown/llms passes must not upload: the
      archived version sub-directories on a root deploy (4.28 4.27). A
      directory needs no trailing /*.
    default: ''
  pdf-file:
    description: >
      File name of the PDF edition, uploaded by a separate job next to the
      pages. No site build produces it, so --delete would prune it.
    default: ''
  access-key-id:
    required: true
  secret-access-key:
    required: true
  endpoint:
    description: R2 S3-compatible endpoint of the Axoflow account.
    default: https://dc6bedf14f451ab276dc7caf3307af2a.r2.cloudflarestorage.com/
  region:
    default: auto

runs:
  using: composite
  steps:
    - name: Sync to R2
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        AWS_S3_ENDPOINT: ${{ inputs.endpoint }}
        AWS_REGION: ${{ inputs.region }}
        BUCKET: ${{ inputs.bucket }}
        DESTINATION: ${{ inputs.destination }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        PROTECT: ${{ inputs.protect }}
        PDF_FILE: ${{ inputs.pdf-file }}
      run: '"$GITHUB_ACTION_PATH/sync.sh"'

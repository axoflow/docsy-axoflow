# Strings this site's own layouts ask for. Docsy's own live in
# themes/docsy/i18n/en.toml and are not repeated here.
#
# config.toml sets `enableMissingTranslationPlaceholders = true`, so a key a
# template names and this file does not define renders as the key itself on the
# page rather than as empty space.

[glossary_filter_legend]
other = "Filter the terms by tag"

[glossary_select_all]
other = "Select all"

[glossary_empty]
other = "No tags are selected, so no terms are shown. Pick a tag above, or select all of them."

[glossary_show_more]
other = "Read more"

[glossary_aka]
other = "Also known as"

# Takes the term's title.
[glossary_permalink]
other = "Link to %s"

# The link from a glossary entry to the page that documents the term. Takes the
# term's title, so the label says where it goes rather than repeating "Read more"
# two dozen times down the page.
[glossary_full_link]
other = "More about %s"

# Page actions for handing the page to an AI assistant (page-meta-links.html).
[page_copy_markdown]
other = "Copy as Markdown"

[page_markdown_copied]
other = "Copied!"

[page_markdown_copy_failed]
other = "Copy failed"

[page_open_in_claude]
other = "Open in Claude"

# Takes the URL of the page's Markdown copy.
[page_ask_claude_prompt]
other = "Read %s so I can ask questions about it."

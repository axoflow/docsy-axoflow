###############################################################################
# Shared defaults for the Axoflow documentation sites that use this theme.
#
# ONLY `[params]` REACHES THE SITE. Hugo merges a theme's params into the
# consuming site's (key by key, never overwriting a value the site sets), but it
# ignores a theme's root-level settings entirely. Measured: this file used to
# carry `[markup.highlight] codeFences = false` and a `[social]` table, and
# neither reached `hugo config` on either site -- the merged config reported
# `codefences = true`, every code block in the build renders as
# `<pre class="chroma">`, and no page ever carried a `twitter:site` tag.
#
# So language settings, `[outputs]`, `[outputFormats]`, `[[server.headers]]`,
# `[markup]`, `[imaging]`, `[minify]`, `[sitemap]`, `[security]`, `[privacy]`,
# `enableGitInfo` and `enableRobotsTXT` belong in each site's own config, which
# is where they already are in both axoflow-docs and axosyslog-core-docs.
#
# `[menus]` is gone too, both trees. The navbar renders from data/nav-menu.yaml
# (_partials/navbar.html), the footer's link columns from data/footer.yaml
# (_partials/footer/row-1.html), and llms.txt from _default/index.llms.txt in
# this theme -- which, unlike Docsy's, does not iterate the menu. Nothing on
# either site reads `.Site.Menus.main`, and `.Site.Menus.footer` had no reader
# anywhere in either theme.
#
# Site-specific values -- product name, version, repository, search backend,
# Prism on or off -- belong to the site and not here: a value in this file
# silently wins wherever a site forgets to set one, which is how the Axoflow
# platform docs came to advertise the AxoSyslog source repository.
#
# What is left is the intersection: read by a docsy-axoflow layout AND meant to
# be identical on every site using the theme.
###############################################################################

[params]

  # Emits <link rel="alternate" type="text/markdown"> from _partials/head.html.
  # It only emits the link -- the .md files themselves are written into `public`
  # after the build by scripts/hugo_to_markdown.py.
  markdownAlternateLink = true

  # Markdown link render hook (layouts/_markup/render-link.html). Validates that
  # every internal link in markdown points to a real page or resource AND that
  # the anchor fragment, if any, matches a heading on the target page. Emits a
  # warnf for each broken reference; does NOT fail the build. Switch errorLevel
  # to "error" if needed.
  #
  # This is the only place either site sets these, and the hook falls back to
  # "ignore" when they are missing, so it stays here rather than moving out to
  # the sites.
  [params.render_hooks.link]
  errorLevel = "warning"   # ignore (default), warning, or error (fails the build)
  highlightBroken = true   # adds .broken class to anchors in dev mode for visual triage

  # Where the glossary's leaf bundle lives, read by _partials/docs/
  # glossary-path.html and through it by both glossary shortcodes and the
  # glossary layout. A site files its glossary elsewhere by setting this, and a
  # site with no glossary at all never reads it — nothing in the theme touches
  # the bundle until a page asks for a term.
  [params.glossary]
  path = "/reference/glossary"

  [params.ui]
  # Enable the light/dark mode toggle in the navbar. Also activates the
  # dark-mode JS bundle and FOUC-prevention init in head.html / baseof.html.
  showLightDarkModeMenu = true
  # Keep displaying the entire toc: Docsy's sidebar-root feature is off. False
  # is also what an unset key evaluates to in _partials/sidebar-tree.html and
  # _partials/sidebar.html -- this line is the record that the switch exists.
  sidebar_root_enabled = false
